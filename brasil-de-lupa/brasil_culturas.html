]};
const MUN = DATA.munis, PRODS = DATA.products;
const fmt = n => Math.round(n).toLocaleString('pt-BR');

const RAMPS = {
  crop:   [[0,[22,58,30]],[.5,[124,179,66]],[1,[250,204,60]]],
  cattle: [[0,[54,20,16]],[.5,[190,74,44]],[1,[250,186,96]]]
};
function lerp(a,b,f){ return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)]; }
function ramp(stops,t){ t=Math.max(0,Math.min(1,t));
  for(let i=1;i<stops.length;i++) if(t<=stops[i][0]){ const[t0,c0]=stops[i-1],[t1,c1]=stops[i]; return lerp(c0,c1,(t-t0)/(t1-t0)); }
  return stops[stops.length-1][1]; }

let cur = 0, hMul = 1, spinning = false, dirty = true, minFrac = 0;
const VIEW = {longitude:-53.5, latitude:-14, zoom:3.3, pitch:52, bearing:-12, maxPitch:85};
let currentVS = {...VIEW};
const MAXH = 185000;

function P(){ return PRODS[cur]; }
function normT(v,p){ return v>0 ? Math.log(v+1)/Math.log(p.max+1) : 0; }

function makeLayers(){
  const p = P(), stops = RAMPS[p.ramp];
  return [
    new deck.GeoJsonLayer({ id:'uf', data:UF_LINES, stroked:true, filled:true,
      getFillColor:[13,20,12,255], getLineColor:[95,130,80,110], lineWidthUnits:'pixels', getLineWidth:1 }),
    new deck.ColumnLayer({ id:'prod', data:MUN, diskResolution:5, radius:3400, extruded:true, pickable:true,
      getPosition:d=>[d[0],d[1]],
      getElevation:(d,{index})=>{ const v=p.vals[index]; return (v>0 && v>=minFrac*p.max) ? Math.sqrt(v/p.max)*MAXH*hMul : 0; },
      getFillColor:(d,{index})=>{ const v=p.vals[index]; return (v>0 && v>=minFrac*p.max) ? ramp(stops, normT(v,p)) : [13,20,12]; },
      updateTriggers:{ getElevation:[cur,hMul,minFrac], getFillColor:[cur,minFrac] },
      material:{ambient:.45,diffuse:.8,shininess:35,specularColor:[80,90,50]} })
  ];
}
function tooltip({object, index}){
  if(!object) return null;
  const p=P(), v=p.vals[index];
  if(!v) return {html:`<b>${object[2]} · ${object[3]}</b><br>sem ${p.name.toLowerCase()}`};
  return {html:`<b>${object[2]} · ${object[3]}</b><br>${p.name}: <b>${fmt(v)}</b> ${p.unit}`};
}

const deckgl = new deck.DeckGL({
  container:'deck-container', initialViewState:currentVS,
  controller:{dragMode:'rotate', dragPan:true, dragRotate:true, inertia:250},
  layers:makeLayers(), getTooltip:tooltip,
  onViewStateChange:({viewState})=>{ currentVS=viewState; },
  parameters:{ clearColor:[0.027,0.039,0.027,1] }
});

let last=performance.now();
function frame(t){
  const dt=(t-last)/1000; last=t;
  if(spinning) currentVS={...currentVS,bearing:(currentVS.bearing+dt*6)%360};
  if(spinning||dirty){ deckgl.setProps({ layers:makeLayers(), initialViewState: spinning?{...currentVS,transitionDuration:0}:undefined }); dirty=false; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('deck-container').addEventListener('pointerdown',()=>{ if(spinning){spinning=false; document.getElementById('spin').checked=false;} });
document.getElementById('hMul').oninput=e=>{ hMul=+e.target.value; dirty=true; };
document.getElementById('minf').oninput=e=>{ const v=+e.target.value; minFrac=Math.pow(v/100,2.5); document.getElementById('minfLbl').textContent=v===0?'tudo':v+'%'; dirty=true; };
document.getElementById('spin').onchange=e=>{ spinning=e.target.checked; dirty=true; };

// picker
const picker=document.getElementById('picker');
PRODS.forEach((p,i)=>{ const b=document.createElement('button'); b.textContent=p.name; b.onclick=()=>select(i); picker.appendChild(b); });
function select(i){
  cur=i; dirty=true;
  [...picker.children].forEach((b,j)=>b.classList.toggle('active', j===i));
  const p=P(), stops=RAMPS[p.ramp];
  document.getElementById('legBar').style.background =
    `linear-gradient(90deg,rgb(${stops[0][1].join(',')}),rgb(${stops[1][1].join(',')}),rgb(${stops[2][1].join(',')}))`;
  document.getElementById('legTitle').textContent = `${p.name} (${p.unit}, escala log)`;
  document.getElementById('legMax').textContent = fmt(p.max)+' '+p.unit;
  // stats: maior produtor + nº de municípios
  let bi=-1, bv=0, cnt=0;
  for(let k=0;k<p.vals.length;k++){ const v=p.vals[k]; if(v>0){cnt++; if(v>bv){bv=v;bi=k;}} }
  document.getElementById('stName').textContent = p.name;
  document.getElementById('stTop').textContent = bi>=0 ? `Maior: ${MUN[bi][2]}/${MUN[bi][3]} (${fmt(bv)} ${p.unit})` : '—';
  document.getElementById('stCount').textContent = fmt(cnt)+' municípios · total '+fmt(p.total)+' '+p.unit;
}
select(0);
</script>
